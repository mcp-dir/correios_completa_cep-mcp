# Smithery configuration for Correios: Completa CEP (CEP + Área territorial brasileira)
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_correios_completa_cep

name: correios_completa_cep-mcp
displayName: "Correios: Completa CEP (CEP + Área territorial brasileira)"
description: >
  Correios: Completa CEP (CEP + Área territorial brasileira), consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/correios_completa_cep-mcp
repository: https://github.com/mcp-dir/correios_completa_cep-mcp

tags:
  - correios_completa_cep
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_correios_completa_cep

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_correios_completa_cep/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
